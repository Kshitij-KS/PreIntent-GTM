
<style>
  .ideas-root { padding: 1.5rem 0; font-family: var(--font-sans); }
  .section-label { font-size: 12px; color: var(--color-text-tertiary); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 1.25rem; }
  .idea-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.25rem; margin-bottom: 1rem; cursor: pointer; transition: border-color 0.15s; }
  .idea-card:hover { border-color: var(--color-border-secondary); }
  .idea-card.open { border-color: var(--color-border-primary); }
  .card-header { display: flex; align-items: flex-start; gap: 12px; }
  .idea-num { font-size: 11px; font-weight: 500; color: var(--color-text-tertiary); min-width: 20px; padding-top: 3px; }
  .card-meta { flex: 1; }
  .card-title { font-size: 15px; font-weight: 500; color: var(--color-text-primary); margin: 0 0 4px; }
  .card-tagline { font-size: 13px; color: var(--color-text-secondary); margin: 0; line-height: 1.5; }
  .chevron { font-size: 16px; color: var(--color-text-tertiary); transition: transform 0.2s; margin-top: 2px; }
  .idea-card.open .chevron { transform: rotate(180deg); }
  .card-body { display: none; margin-top: 1.25rem; border-top: 0.5px solid var(--color-border-tertiary); padding-top: 1.25rem; }
  .idea-card.open .card-body { display: block; }
  .detail-section { margin-bottom: 1rem; }
  .detail-label { font-size: 11px; font-weight: 500; color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 6px; }
  .detail-text { font-size: 13px; color: var(--color-text-secondary); line-height: 1.6; }
  .tags-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: var(--border-radius-md); }
  .tag-bd { background: #EEEDFE; color: #3C3489; }
  .tag-partner { background: #E1F5EE; color: #085041; }
  .tag-signal { background: #FAEEDA; color: #633806; }
  .wow-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: var(--border-radius-md); background: #FAECE7; color: #712B13; margin-bottom: 10px; }
  .step-row { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
  .step-dot { width: 20px; height: 20px; border-radius: 50%; background: var(--color-background-secondary); border: 0.5px solid var(--color-border-secondary); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 500; color: var(--color-text-secondary); flex-shrink: 0; margin-top: 2px; }
  .step-text { font-size: 13px; color: var(--color-text-secondary); line-height: 1.5; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 500px) { .two-col { grid-template-columns: 1fr; } }
</style>

<div class="ideas-root">
  <h2 class="sr-only">7 niche hackathon ideas for GTM Intelligence track</h2>
  <p class="section-label">Track 1 · GTM Intelligence · 7 ideas</p>

  <div id="cards"></div>
</div>

    ],
    brightData: ["SERP API", "Web Scraper API"],
    partners: ["Cognee (exposure memory)", "TriggerWare.ai (CRM push)", "AI/ML API (law → ICP mapping)"],
    signals: ["New federal rule posted", "State law signed", "Industry standard updated", "Enforcement action filed"],
  },
  {
    title: "Job Posting Roadmap Decoder",
    tagline: "Every job posting is a product roadmap in disguise. Decode what competitors are building next — before they announce anything.",

    partners: ["Cognee (hiring history memory)", "AI/ML API (intent extraction)", "TriggerWare.ai (Slack/CRM delivery)"],

    wow: "Warm outreach to a confirmed advocate beats cold outreach by 10x — this system automates the discovery of every one of them.",

    partners: ["Cognee (champion relationship memory)", "Speechmatics (audio hire announcements)", "TriggerWare.ai (rep alerts)"],

    tagline: "Monitor niche professional communities for live pain signals, extract the company, enrich the lead, and push it to your CRM — all in real time.",
    wow: "Intercepts buyers before they even know they're in-market — at the exact moment they're suffering the problem you solve.",

    howItWorks: [
      "Scraping Browser monitors target subreddits, HN threads, niche Slack communities (public-facing), Stack Overflow, and product review forums",

  },
  {
    title: "Ghost Competitor Early Warning Radar",

function renderIdea(idea, i) {
  return `
  <div class="idea-card" onclick="toggle(${i})" id="card-${i}">
    <div class="card-header">
      <span class="idea-num">${String(i+1).padStart(2,'0')}</span>
      <div class="card-meta">
        <p class="card-title">${idea.title}</p>
        <p class="card-tagline">${idea.tagline}</p>
      </div>
      <i class="ti ti-chevron-down chevron" aria-hidden="true"></i>
    </div>
    <div class="card-body" id="body-${i}">
      <div class="wow-badge"><i class="ti ti-bolt" aria-hidden="true"></i> Why this is different</div>
      <p class="detail-text" style="margin-bottom:1.25rem">${idea.wow}</p>

      <div class="two-col">
        <div class="detail-section">
          <div class="detail-label">The problem it solves</div>
          <div class="detail-text">${idea.problem}</div>
        </div>
        <div class="detail-section">
          <div class="detail-label">How it works</div>
          ${idea.howItWorks.map((s,j) => `<div class="step-row"><div class="step-dot">${j+1}</div><div class="step-text">${s}</div></div>`).join('')}
        </div>
      </div>

      <div class="detail-section">
        <div class="detail-label">Bright Data tools</div>
        <div class="tags-row">${idea.brightData.map(t=>`<span class="tag tag-bd"><i class="ti ti-database" aria-hidden="true"></i> ${t}</span>`).join('')}</div>
      </div>
      <div class="detail-section" style="margin-top:10px">
        <div class="detail-label">Partner integrations</div>
        <div class="tags-row">${idea.partners.map(t=>`<span class="tag tag-partner">${t}</span>`).join('')}</div>
      </div>
      <div class="detail-section" style="margin-top:10px">
        <div class="detail-label">Key signals monitored</div>
        <div class="tags-row">${idea.signals.map(t=>`<span class="tag tag-signal">${t}</span>`).join('')}</div>
      </div>
    </div>
  </div>`;
}

document.getElementById('cards').innerHTML = ideas.map(renderIdea).join('');

function toggle(i) {
  const card = document.getElementById('card-'+i);
  card.classList.toggle('open');
}
</script>
